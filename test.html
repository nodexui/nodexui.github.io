<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodexUI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Outfit:wght@400;500;600;700;800&family=Luckiest Guy&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="512x512" href="../logo.png">
    <link rel="stylesheet" href="../css_file/animation.css">
    <style>
        .main-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .win-card {
            position: absolute;
            background-color: rgb(236, 236, 236);
            padding: 15px;
            width: 90%;
            justify-self: center;
            top: 10px;
            height: 300px;
            display: grid;
            gap: 20px;
            grid-template-columns: 72px 1fr;
        }

        .left {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .left span {
            height: 2px;
            background-color: red;
        }

        .head {
            z-index: 100;
            position: sticky;

        }
    </style>
</head>

<body>
    <div class="main-body">
        <div class="head" style="display: block;">Hello</div>
        <div class="win-card">
            <div class="left">
                <span></span><span></span>
            </div>
            <div class="right">
                <p>Contact NodexUI</p>
            </div>
        </div>
    </div>
</body>

</html>
